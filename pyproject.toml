[project]
name = "yeen-gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TylerFlar", email = "tulikkovulpus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.2",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[project.scripts]
yeen-gpt = "yeen_gpt.train:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
